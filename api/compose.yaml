# The API behind the web's nginx container, which proxies /api/ to http://api:8080/ on the shared
# network moleonline and sets X-Forwarded-For, the API logs that client address.
# The network is created once, before either project starts: docker network create moleonline
services:
  api:
    build: .
    image: moleonline-api
    restart: unless-stopped
    init: true # reaps processes left by killed computations
    networks:
      - moleonline
    volumes:
      - data:/data # computations, the submission log, OPM files
    environment:
      TZ: Europe/Prague # times in the submission log

networks:
  moleonline:
    external: true

volumes:
  data:
