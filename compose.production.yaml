# Production, on top of compose.yaml: HTTPS for the domains in SERVER_NAMES, which the instance's .env sets
# (deploy/production.env or deploy/dev.env), with a Let's Encrypt certificate renewed by certbot --webroot
services:
  web:
    # replaces the base file's ports, which would otherwise be added to these
    ports: !override
      - "80:8080"
      - "443:8443"
    environment:
      SERVER_NAMES: ${SERVER_NAMES:?set in .env, see deploy/}
    volumes:
      - ./web/docker/conf.d/production.conf.template:/etc/nginx/templates/server.conf.template:ro
      - /var/www/certbot:/var/www/certbot:ro # certbot's webroot
      - /var/lib/moleonline/certs:/etc/nginx/certs:ro # written by deploy/certbot-deploy-hook.sh
