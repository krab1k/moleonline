# Site configuration, included in the server block of conf.d/server.conf

root /var/www;
index index.html;

# Keep redirects relative: nginx listens on 8080 inside the container,
# which is not the port clients connect to
absolute_redirect off;

server_tokens off;

gzip on;
gzip_vary on;
gzip_types text/plain text/xml text/css application/json application/javascript text/javascript image/svg+xml;

location / {
    # Pages, PDF templates and example data keep their names across deploys,
    # so browsers revalidate them
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
}

# Vite output: file names change with their content
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location /images/ {
    add_header Cache-Control "public, max-age=86400";
}

location = /favicon.ico {
    add_header Cache-Control "public, max-age=86400";
    try_files /images/favicon.ico =404;
}

# /online itself is the start page
location = /online {
    return 302 /;
}

location = /online/ {
    return 302 /;
}

location ^~ /online/templates/ {
    rewrite ^/online/templates/(.*)$ /html/templates/$1 last;
}

# Computation detail: /online/<computationId>[/<submitId>|/ChannelsDB]
location ^~ /online/ {
    rewrite ^ /html/detail.html last;
}

# The MOLE API, see conf.d/api.conf.template; its client and rate limit, conf.d/clients.conf.template
location /api/ {
    limit_req zone=api burst=200 nodelay;  # a page polling the API stays far below, a room behind one address too
    error_page 429 = @too_many_requests;   # of the rate limit; the API's own 429 passes as it is
    proxy_pass http://mole_api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;  # the client only, nothing it sent itself
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 31m;    # uploaded structures, the API accepts files up to 30 MB
    proxy_connect_timeout 3s;    # the API is on the same host; after its restart nginx may still try the old address for up to 10 s
}

# As the API's errors: problem details (RFC 9457) with a detail the website shows
location @too_many_requests {
    default_type application/problem+json;
    add_header Retry-After 1 always;
    return 429 '{"type":"about:blank","title":"Too Many Requests","status":429,"detail":"Too many requests from your address. Please, slow down."}';
}
