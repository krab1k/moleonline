# The MOLE API on its own, on port API_PORT. Settings (backend/README.md#configuration) in .env next to this file, which
# compose also reads for the variables below, e.g. CORS_ORIGINS='["https://moleonline.cz"]'.
name: moleonline-api

services:
  api:
    build: .
    image: moleonline-api
    restart: unless-stopped
    init: true # reaps processes left by killed computations
    ports:
      - "${API_PORT:-8000}:8080"
    env_file:
      - path: .env
        required: false
    # all computations together; above it the kernel kills the largest process, a computation, not the whole host
    mem_limit: ${API_MEMORY_LIMIT:-24g}
    # the same, so no swap: by default the container may swap as much again, slowing the host instead of the kill
    memswap_limit: ${API_MEMORY_LIMIT:-24g}
    volumes:
      - data:/data # computations, the submission log, OPM files

volumes:
  data:
