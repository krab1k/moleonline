apiVersion: apps/v1
kind: Deployment
metadata:
  name: moleonline-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: moleonline-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: moleonline-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        fsGroup: 1654
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/krab1k/moleonline-api:latest
          imagePullPolicy: Always
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: moleonline-db-app
                  key: uri
            - name: UVICORN_ROOT_PATH
              value: /api
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:  # with the database: without it, the API gets no requests
            httpGet:
              path: /version
              port: http
            timeoutSeconds: 5
          livenessProbe:  # without the database: its outage is no reason to restart the API
            httpGet:
              path: /health
              port: http
            timeoutSeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: moleonline-data
---
apiVersion: v1
kind: Service
metadata:
  name: moleonline-api
spec:
  selector:
    app.kubernetes.io/name: moleonline-api
  ports:
    - name: http
      port: 8080
      targetPort: http
