name: Test, build and publish

on:
  push: # other branches are checked by their pull requests, not twice
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres: # the tests' database, emptied before each test
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Install the API with its development tools
        run: uv sync --locked

      - name: Check the code with ruff
        run: uv run ruff check

      # the tests needing the real MOLE or MEMEMBED are skipped (MOLE2, MEMEMBED not set)
      - name: Run the tests
        run: uv run pytest

  web:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24 # as the web's image (docker/Dockerfile)

      - name: Install the dependencies
        run: npm ci

      - name: Run the tests
        run: npm test

  compose:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check compose.yaml (its images are built below)
        run: docker compose config --quiet

  # the images Kubernetes runs: built for every pull request, pushed to ghcr.io for each commit on main (its full
  # hash, and latest)
  images:
    runs-on: ubuntu-26.04
    needs: [api, web, compose]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: moleonline-api
            context: backend
            target: api
          - image: moleonline-worker
            context: backend
            target: worker
          - image: moleonline-web
            context: web
            file: web/docker/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, and on main push, ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
