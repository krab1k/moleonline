# MOLEonline: the web's nginx serves the site and proxies /api/ to the API (web/docker/site.conf),
# which has no port on the host. Production: also compose.production.yaml.
name: moleonline

services:
  db:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mole
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mole}
      POSTGRES_DB: mole
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mole"]
      interval: 5s
      retries: 20

  api:
    build: backend
    image: moleonline-api
    restart: unless-stopped
    init: true # reaps processes left by killed computations
    # all computations together; above it the kernel kills the largest process, a computation, not the whole host
    mem_limit: ${API_MEMORY_LIMIT:-24g}
    # the same, so no swap: by default the container may swap as much again, slowing the host instead of the kill
    memswap_limit: ${API_MEMORY_LIMIT:-24g}
    environment:
      UVICORN_ROOT_PATH: /api # served by the web's nginx under /api/
      DATABASE_URL: postgresql+asyncpg://mole:${POSTGRES_PASSWORD:-mole}@db/mole # the sessions, jobs, the queue
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - data:/data # the sessions' files, OPM files

  web:
    build:
      context: web
      dockerfile: docker/Dockerfile
      args:
        # The API is served by this site's nginx under /api (site.conf)
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: moleonline-web
    restart: unless-stopped
    ports:
      - "${MOLEONLINE_PORT:-8080}:8080"
    environment:
      # The entrypoint writes the templates to conf.d with the container's DNS servers
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: 1
    # z: labels the files for containers under SELinux (podman on Fedora), ignored on hosts without it
    volumes:
      - ./web/docker/nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ./web/docker/site.conf:/etc/nginx/site.conf:ro,z
      - ./web/docker/conf.d/devel.conf.template:/etc/nginx/templates/server.conf.template:ro,z
      - ./web/docker/conf.d/api.conf.template:/etc/nginx/templates/api.conf.template:ro,z
    logging:
      driver: journald
      options:
        tag: moleonline-web

volumes:
  data:
  db:
