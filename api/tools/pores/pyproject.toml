[project]
name = "pores"
version = "0.1.0"
description = "Pore computation for MOLEonline: membrane position and a MOLE path across it"
authors = [
    { name = "Tomáš Raček", email = "tom@krab1k.net" }
]
requires-python = ">=3.14"
dependencies = [
    "gemmi>=0.7.5",
    "numpy>=2.5.4",
]

[project.scripts]
pores = "pores.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
