# The server block is in conf.d/server.conf, written by the entrypoint from conf.d/server.conf.template (compose.yaml)
# nginx runs as the user nginx, which cannot write to /run (see the Dockerfile for the rest)
pid /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include  /etc/nginx/mime.types;

    include /etc/nginx/conf.d/*.conf;
}
