[project]
name = "moleonline-backend"
version = "0.7.0"
description = "MOLEonline API: computes tunnels and pores with MOLE 2"
authors = [
    { name = "Tomáš Raček", email = "tom@krab1k.net" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.3",
    "gemmi>=0.7.5",
    "httpx2>=2.13.1",
    "numpy>=2.5.4",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "moleonline"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
src = ["src"]

[tool.ruff.lint]
extend-select = ["E", "W", "B", "RUF"]

[tool.alembic]
# the one revision (until MOLEonline is deployed) is made anew: README.md#database
script_location = "%(here)s/src/moleonline/migrations"

[[tool.alembic.post_write_hooks]]
name = "ruff"
type = "module"
module = "ruff"
options = "check --fix --quiet REVISION_SCRIPT_FILENAME"
