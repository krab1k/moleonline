# MOLEonline for local use, over HTTP (deployments are in Kubernetes); only the web has a port, it serves the API
# under /api/
name: moleonline

services:
  db:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mole
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mole}
      POSTGRES_DB: mole
    volumes:
      - db:/var/lib/postgresql # PostgreSQL 18 keeps its data in 18/docker under it
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mole"]
      interval: 5s
      retries: 20

  api:
    build:
      context: backend
      target: api
    image: moleonline-api
    restart: unless-stopped
    mem_limit: 2g
    environment:
      UVICORN_ROOT_PATH: /api
      DATABASE_URL: postgresql+asyncpg://mole:${POSTGRES_PASSWORD:-mole}@db/mole
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - data:/data

  worker:
    build:
      context: backend
      target: worker
    image: moleonline-worker
    restart: unless-stopped
    init: true # reaps processes left by killed computations
    stop_grace_period: 30s
    scale: ${WORKERS:-4}
    mem_limit: ${WORKER_MEMORY_LIMIT:-6g}
    # the same, so no swap: by default the container may swap as much again, slowing the host instead of the kill
    memswap_limit: ${WORKER_MEMORY_LIMIT:-6g}
    # the worker touches /tmp/heartbeat at least every 2 s, also while it waits for the database; $$: the container's
    # shell, not compose's variables
    healthcheck:
      test: ["CMD-SHELL", 'test $$(( $$(date +%s) - $$(stat -c %Y /tmp/heartbeat) )) -lt 60']
      interval: 30s
      start_period: 60s
    environment:
      DATABASE_URL: postgresql+asyncpg://mole:${POSTGRES_PASSWORD:-mole}@db/mole
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - data:/data

  web:
    build:
      context: web
      dockerfile: docker/Dockerfile
    image: moleonline-web
    restart: unless-stopped
    ports:
      - "${MOLEONLINE_PORT:-8080}:8080"
    logging:
      driver: journald
      options:
        tag: moleonline-web

volumes:
  data:
  db:
