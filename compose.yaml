# MOLEonline: the web's nginx serves the site and proxies /api/ to the API (web/docker/site.conf), which has no port on
# the host; the API queues the computations, the workers run them, PostgreSQL keeps them. For local use, over HTTP;
# deployments are in Kubernetes.
name: moleonline

services:
  db:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mole
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mole}
      POSTGRES_DB: mole
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mole"]
      interval: 5s
      retries: 20

  api:
    build:
      context: backend
      target: api
    image: moleonline-api
    restart: unless-stopped
    mem_limit: 2g # answers requests and queues runs; the workers compute
    environment:
      UVICORN_ROOT_PATH: /api # served by the web's nginx under /api/
      DATABASE_URL: postgresql+asyncpg://mole:${POSTGRES_PASSWORD:-mole}@db/mole # the sessions, jobs, the queue
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - data:/data # the sessions' files

  # runs the queued computations, one at a time each; WORKERS of them, or: docker compose up -d --scale worker=N
  worker:
    build:
      context: backend
      target: worker # with MOLE and MEMEMBED
    image: moleonline-worker
    restart: unless-stopped
    init: true # reaps processes left by killed computations
    stop_grace_period: 30s # SIGTERM: its run's processes are killed, the run fails as interrupted
    scale: ${WORKERS:-4}
    # of its one computation: near it MOLE (.NET) stops as out of memory, above it the kernel kills the computation
    mem_limit: ${WORKER_MEMORY_LIMIT:-6g}
    # the same, so no swap: by default the container may swap as much again, slowing the host instead of the kill
    memswap_limit: ${WORKER_MEMORY_LIMIT:-6g}
    # unhealthy (shown, not restarted by compose) when its loop hangs: it touches /tmp/heartbeat at least every 2 s,
    # also while it waits for the database; $$: the container's shell, not compose's variables
    healthcheck:
      test: ["CMD-SHELL", 'test $$(( $$(date +%s) - $$(stat -c %Y /tmp/heartbeat) )) -lt 60']
      interval: 30s
      start_period: 60s
    environment:
      DATABASE_URL: postgresql+asyncpg://mole:${POSTGRES_PASSWORD:-mole}@db/mole
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - data:/data # the sessions' files, OPM files

  web:
    build:
      context: web
      dockerfile: docker/Dockerfile
      args:
        # The API is served by this site's nginx under /api (site.conf)
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: moleonline-web
    restart: unless-stopped
    ports:
      - "${MOLEONLINE_PORT:-8080}:8080"
    environment:
      # The entrypoint writes the templates to conf.d with the container's DNS servers
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: 1
    # z: labels the files for containers under SELinux (podman on Fedora), ignored on hosts without it
    volumes:
      - ./web/docker/nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ./web/docker/site.conf:/etc/nginx/site.conf:ro,z
      - ./web/docker/conf.d/server.conf.template:/etc/nginx/templates/server.conf.template:ro,z
      - ./web/docker/conf.d/api.conf.template:/etc/nginx/templates/api.conf.template:ro,z
    logging:
      driver: journald
      options:
        tag: moleonline-web

volumes:
  data:
  db:
