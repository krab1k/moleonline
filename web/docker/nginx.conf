# Shared by both setups; the server blocks are in conf.d/server.conf, written by the entrypoint from
# conf.d/devel.conf.template or conf.d/production.conf.template (see the compose files)
# nginx runs as the user nginx, which cannot write to /run (see the Dockerfile for the rest)
pid /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include  /etc/nginx/mime.types;

    # Headers added in a location are added to those of the server, instead of replacing them
    add_header_inherit merge;

    include /etc/nginx/conf.d/*.conf;
}
