# Production, on top of compose.yaml: HTTPS with the host's Let's Encrypt certificates
services:
  web:
    # replaces the base file's ports, which would otherwise be added to these
    ports: !override
      - "80:8080"
      - "443:8443"
    volumes:
      - ./web/docker/conf.d/production.conf:/etc/nginx/conf.d/server.conf:ro
      - /etc/letsencrypt/live/moleonline.biodata.ceitec.cz/fullchain.pem:/etc/fullchain.pem:ro
      - /etc/letsencrypt/live/moleonline.biodata.ceitec.cz/privkey.pem:/etc/privkey.pem:ro
